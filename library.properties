sentence=A classifier that trains on the microcontroller itself, in one pass over the data.
paragraph=SEFR (Keshavarz et al., arXiv:2006.04620) learns a linear multiclass classifier from samples streamed one at a time, using only per-class sums and feature ranges. An optional second pass (LDA on the class scores) improves multiclass accuracy. No dynamic memory; runs on 2 KB RAM boards such as the Uno.
